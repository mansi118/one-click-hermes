# docker-compose.neuraledge.yml — overlay on upstream docker-compose.yml.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.neuraledge.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.neuraledge.yml exec gateway hermes doctor
#
# This file adds ONE thing to upstream: the `cortex-mcp` service, the MCP bridge
# into NEOS CORTEX-PALACE. Upstream's `gateway` and `dashboard` services keep
# their definitions verbatim; we only inject a depends_on link so cortex-mcp
# starts before the gateway tries to call it.
#
# Networking note: upstream uses `network_mode: host` for the gateway and
# dashboard. cortex-mcp does the same and binds to 127.0.0.1:8765 (loopback
# only) — the gateway reaches it at http://127.0.0.1:8765/sse. No bridge
# network, no published ports, no host exposure.

services:
  # ── inherit upstream gateway, add cortex-mcp dependency + docker-sock mount
  #    (the latter is required by terminal.backend: "docker" in config.yaml,
  #    which we set so the agent's shell tool spawns sibling sandbox
  #    containers on the host rather than running in-process inside the
  #    gateway container itself).
  gateway:
    depends_on:
      cortex-mcp:
        condition: service_healthy
    volumes:
      # Sibling-sandbox docker — required by terminal.backend: "docker" in
      # config.yaml. Without this, the agent's shell tool can't spawn
      # sandbox containers and silently fails on first use.
      - /var/run/docker.sock:/var/run/docker.sock
    # /dev/shm default is 64 MB. Playwright/Chrome (browser skill) and large
    # pip installs in the sandbox can OOM with that. Bump to 1 GB so the
    # browser tool doesn't fail on first use with cryptic "page crashed".
    shm_size: 1g

  # ── new: CORTEX-PALACE MCP bridge ─────────────────────────────────────────
  cortex-mcp:
    image: neuraledge/cortex-mcp:latest
    container_name: cortex-mcp
    build:
      context: ./neuraledge/mcp/cortex-palace
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${HOME}/.hermes/.env
    environment:
      - CORTEX_MCP_TRANSPORT=sse
      - HOST=127.0.0.1               # loopback only — gateway reaches via 127.0.0.1:8765
      - PORT=8765
      - TZ=${TZ:-Asia/Kolkata}
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-m", "cortex_mcp.healthcheck"]
      interval: 30s
      timeout: 8s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
