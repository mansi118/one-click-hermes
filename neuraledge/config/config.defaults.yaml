# NeuralEDGE Agent — default Hermes config.
# Installer seeds this to ~/.hermes/config.yaml on first run (only if absent).
# Schema reference: cli-config.yaml.example in upstream Hermes Agent (v2026.5.16).
#
# Secrets live in ~/.hermes/.env, not here.
# MCP servers live in this file under `mcp_servers:` (verified against
#   hermes_cli/mcp_config.py:8 — "keeps configuration in ~/.hermes/config.yaml
#   under the ``mcp_servers`` key").
# Persona lives in ~/.hermes/SOUL.md (seeded from neuraledge/branding/SOUL.md).
# Skin lives in ~/.hermes/skins/neuraledge.yaml.

# ─── Model ──────────────────────────────────────────────────────────────────
# Defaults to OpenRouter for flexibility. Swap via `hermes model` or by editing
# the `default` field. API key comes from $OPENROUTER_API_KEY in .env.
model:
  default: "anthropic/claude-sonnet-4-6"
  provider: "auto"
  base_url: "https://openrouter.ai/api/v1"

# ─── Terminal tool backend ──────────────────────────────────────────────────
# Docker backend so agent-run code is sibling-sandboxed, not running inside the
# agent container. The agent reaches the host's Docker daemon via the mounted
# socket in docker-compose.neuraledge.yml.
terminal:
  backend: "docker"
  cwd: "/workspace"
  timeout: 180
  lifetime_seconds: 300
  docker_image: "nikolaik/python-nodejs:python3.11-nodejs20"
  docker_mount_cwd_to_workspace: true
  docker_run_as_host_user: true

# ─── Display / skin ─────────────────────────────────────────────────────────
# Activates the NeuralEDGE skin (banner, colors, agent_name, etc.) from
# ~/.hermes/skins/neuraledge.yaml — seeded by the installer.
display:
  skin: neuraledge
  tool_progress: "new"

# ─── Skills ─────────────────────────────────────────────────────────────────
# Hermes loads all installed skills by default (opt-out model).
# NeuralEDGE seed skills (skills/neuraledge/*/SKILL.md) are auto-loaded.
# Disable per-platform if a skill should not run in a given channel.
skills:
  disabled: []
  platform_disabled:
    telegram: []
    cli: []

# ─── Gateway ────────────────────────────────────────────────────────────────
# Telegram bot token + allowed user-ids come from ~/.hermes/.env at runtime.
# Dashboard binds to 127.0.0.1 — reach via SSH tunnel only.
gateway:
  # proxy_url: ""   # leave unset; we run the agent in-process

# ─── MCP servers ────────────────────────────────────────────────────────────
# Server entry shape (per tools/mcp_tool.py):
#   stdio servers:  command + args + env
#   HTTP servers:   url
#   SSE servers:    url + transport: sse
# CORTEX-PALACE bridge: SSE on 127.0.0.1:8765 (cortex-mcp container, host-net).
mcp_servers:
  cortex-mcp:
    url: "http://127.0.0.1:8765/sse"
    transport: sse

# ─── Worktree isolation ─────────────────────────────────────────────────────
# Off by default. Turn on if multiple concurrent CLI sessions need their own
# worktrees on the same repo.
worktree: false
