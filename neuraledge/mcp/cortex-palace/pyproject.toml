[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "cortex-mcp"
version         = "0.1.0"
description     = "MCP bridge from Hermes/Neural to NEOS CORTEX-PALACE"
readme          = "README.md"
requires-python = ">=3.11"
license         = { text = "MIT" }
authors         = [{ name = "NeuralEDGE", email = "hello@neuraledge.in" }]
keywords        = ["mcp", "neuraledge", "neos", "cortex-palace", "hermes"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=1.2.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "anyio>=4.0",
  "structlog>=24.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
cortex-mcp           = "cortex_mcp.server:main"
cortex-mcp-healthcheck = "cortex_mcp.healthcheck:main"

[project.urls]
Homepage = "https://neuraledge.in"
Source   = "https://github.com/neuraledge/hermes-agent"

[tool.setuptools.packages.find]
include = ["cortex_mcp*"]
exclude = ["tests*"]

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S", "ASYNC"]
ignore = ["ANN101", "ANN102"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
